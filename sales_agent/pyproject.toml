[project]
name = "sales_agent"
version = "0.1.0"
description = "Sales_Agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.3.0",
]

[project.scripts]
sales_agent = "sales_agent.main:run"
run_crew = "sales_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
entrypoint = "main.py"
source-dir = "src/sales_agent"
